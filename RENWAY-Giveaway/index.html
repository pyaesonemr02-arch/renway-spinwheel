<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RENWAY Fashion Studio | Giveaway Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <!-- Admin Sidebar (Hidden in Record Mode) -->
        <aside class="admin-panel" id="adminPanel">
            <header>
                <!-- Brand Logo Integration -->
                <img src="assets/renway-logo.png" alt="RENWAY Fashion Studio" class="brand-logo" onerror="this.style.display='none'">
                <h1>RENWAY</h1>
                <p>Giveaway Management</p>
            </header>

            <section class="control-group">
                <h3>1. Add Participants</h3>
                <textarea id="participantInput" placeholder="Paste usernames here (one per line)..."></textarea>
                <div class="button-row">
                    <button class="btn-secondary" id="btnImport">Import (TXT/CSV)</button>
                    <input type="file" id="fileInput" accept=".txt,.csv" hidden>
                    <button class="btn-primary" id="btnAdd">Add & Deduplicate</button>
                </div>
                <div class="stats">
                    Total Participants: <span id="participantCount">0</span>
                </div>
            </section>

            <section class="control-group">
                <h3>2. Prize Selection</h3>
                <select id="prizeSelect">
                    <option value="Dragon Set">Dragon Set (1 remaining)</option>
                    <option value="KPay 3000 MMK">KPay 3000 MMK (9 remaining)</option>
                </select>
            </section>

            <section class="control-group">
                <h3>3. Controls</h3>
                <div class="button-row">
                    <button class="btn-danger" id="btnClear">Clear All</button>
                    <button class="btn-secondary" id="btnRecordMode">TikTok Record Mode</button>
                </div>
                <div class="button-row">
                     <button class="btn-secondary" id="btnExport">Export Winners (CSV)</button>
                </div>
            </section>

            <section class="winners-list">
                <h3>Recent Winners</h3>
                <ul id="winnersUl"></ul>
            </section>
        </aside>

        <!-- Main Wheel Area -->
        <main class="wheel-area" id="wheelArea">
            <div class="wheel-wrapper">
                <!-- Pointer -->
                <div class="wheel-pointer"></div>
                
                <!-- Center Logo Integration -->
                <div class="wheel-center-logo">
                    <img src="assets/renway-logo.png" alt="R" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span style="display:none;">R</span>
                </div>
                
                <!-- Canvas Engine -->
                <canvas id="wheelCanvas" width="800" height="800"></canvas>
            </div>
            <button class="btn-spin" id="btnSpin">SPIN THE WHEEL</button>
        </main>

    </div>

    <!-- Winner Modal -->
    <div class="modal-overlay" id="winnerModal">
        <div class="modal-content">
            <h2 class="gold-text">WINNER!</h2>
            <div class="winner-name" id="winnerNameDisplay">@username</div>
            <div class="winner-prize" id="winnerPrizeDisplay">Won: Dragon Set</div>
            <div class="modal-actions">
                <button class="btn-primary" id="btnAcceptWinner">Accept & Remove</button>
                <button class="btn-secondary" id="btnRespin">Discard & Re-spin</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
